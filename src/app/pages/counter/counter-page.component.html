<div class="container">
    <h1>Counter Component</h1>
    <hr>
    <h3>Propiedad Counter del archivo counter-page.ts: {{ counter }} </h3>

    <button  (click)="resetCounter()"> Reset </button>
    <button  (click)="increasedBy( -1 )"> -1 </button>
</div>
